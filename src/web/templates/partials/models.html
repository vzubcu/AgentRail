<!-- Models Tab -->
<section id="models" class="tab-content">
  <header class="glass-header border-b border-slate-200/80 dark:border-slate-800/80 p-6 mb-6">
    <div class="flex items-center justify-between">
      <div>
        <span class="page-kicker text-slate-500 dark:text-slate-400">Model Catalog</span>
        <h1 class="text-xl font-bold text-slate-900 dark:text-white">Active model catalog available to the API</h1>
      </div>
      <div class="flex items-center gap-2">
        <button class="px-3 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 text-sm font-medium hover:text-indigo-500 dark:hover:text-indigo-300 transition-all" type="button" data-refresh-models data-refresh-label="Refresh">
          Refresh
        </button>
      </div>
    </div>
  </header>

  <div class="toolbar" aria-label="Model filters">
    <div class="toolbar-main">
      <input type="text" id="model-search" placeholder="Search models, providers, modality..." aria-label="Search models" class="field-input w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700/80 dark:bg-slate-900/50 text-sm focus:outline-none focus:border-indigo-500 dark:focus:border-indigo-400 transition-colors">
      <select id="model-provider-filter" aria-label="Provider filter" class="ml-2 block rounded-lg border border-slate-200 dark:border-slate-700/80 dark:bg-slate-900/50 px-2.5 py-1.5 text-sm focus:outline-none focus:border-indigo-500 dark:focus:border-indigo-400 transition-colors">
        <option value="all">All providers</option>
      </select>
      <select id="model-tier-filter" aria-label="Tier filter" class="ml-2 block rounded-lg border border-slate-200 dark:border-slate-700/80 dark:bg-slate-900/50 px-2.5 py-1.5 text-sm focus:outline-none focus:border-indigo-500 dark:focus:border-indigo-400 transition-colors">
        <option value="all">All tiers</option>
      </select>
      <select id="model-sort" aria-label="Sort" class="ml-2 block rounded-lg border border-slate-200 dark:border-slate-700/80 dark:bg-slate-900/50 px-2.5 py-1.5 text-sm focus:outline-none focus:border-indigo-500 dark:focus:border-indigo-400 transition-colors">
        <option value="name">Sort: Name</option>
        <option value="context">Context size</option>
        <option value="providers">Number of providers</option>
      </select>
    </div>
  </div>

  <div class="models-list" id="models-list">
    <!-- Dynamic content -->
  </div>
</section>
