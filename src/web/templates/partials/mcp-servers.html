<!-- MCP Servers Tab -->
<section id="mcp-servers" class="tab-content">
  <header class="glass-header border-b border-slate-200/80 dark:border-slate-800/80 p-6 mb-6">
    <div class="flex items-center justify-between">
      <div>
        <span class="page-kicker">MCP Servers</span>
        <h1 class="page-title">Manage MCP server connections.</h1>
        <p class="page-description">Configure Model Context Protocol servers to extend AgentRail with external tools and resources.</p>
      </div>
      <div class="flex items-center gap-2">
        <button class="btn btn--primary" data-mcp-action="add-server">Add Server</button>
      </div>
    </div>
  </header>

  <div id="mcp-servers-list"></div>
</section>

<!-- Add/Edit Server Modal Template -->
<div class="modal-overlay" id="mcp-server-modal" hidden>
  <div class="modal-content bg-white dark:bg-slate-900 rounded-2xl shadow-xl max-w-md w-full mx-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header flex items-center justify-between p-4 border-b border-slate-200/80 dark:border-slate-800/80">
      <h3 id="modal-title">Add MCP Server</h3>
      <button type="button" class="modal-close" id="close-server-modal-btn" aria-label="Close">&times;</button>
    </div>
    <form id="mcp-server-form" class="modal-form p-4 space-y-4">
      <input type="hidden" id="server-id">

      <div class="field">
        <label for="server-name" class="field-label">Name *</label>
        <input type="text" id="server-name" name="name" class="field-input" required>
      </div>

      <div class="field">
        <label for="server-endpoint" class="field-label">Endpoint URL *</label>
        <input type="url" id="server-endpoint" name="endpoint" class="field-input" required placeholder="http://localhost:8080/mcp">
      </div>

      <div class="field">
        <label for="server-tools" class="field-label">Available Tools (one per line)</label>
        <textarea id="server-tools" name="tools" class="field-input" rows="4" placeholder="tool-a, tool-b, tool-c"></textarea>
      </div>

      <div class="field">
        <label for="server-resources" class="field-label">Available Resources (one per line)</label>
        <textarea id="server-resources" name="resources" class="field-input" rows="2" placeholder="resource-a, resource-b"></textarea>
      </div>

      <div class="field">
        <label for="server-description" class="field-label">Description</label>
        <textarea id="server-description" name="description" class="field-input" rows="2" placeholder="Optional description for this server"></textarea>
      </div>

      <div class="field field--checkbox">
        <label class="field-label flex items-center gap-2">
          <input type="checkbox" id="server-enabled" name="enabled" checked>
          <span>Enabled</span>
        </label>
      </div>

      <div class="form-actions flex justify-end gap-2 pt-2 border-t border-slate-200/80 dark:border-slate-800/80">
        <button type="button" class="btn btn--secondary" id="cancel-server-btn">Cancel</button>
        <button type="submit" class="btn btn--primary" id="save-server-btn">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete Confirmation Modal Template -->
<div class="modal-overlay" id="mcp-server-delete-modal" hidden>
  <div class="modal-content bg-white dark:bg-slate-900 rounded-2xl shadow-xl max-w-md w-full mx-4" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
    <div class="modal-header flex items-center justify-between p-4 border-b border-slate-200/80 dark:border-slate-800/80">
      <h3 id="delete-modal-title">Delete Server</h3>
      <button type="button" class="modal-close" id="close-delete-modal-btn" aria-label="Close">&times;</button>
    </div>
    <p class="modal-body-text p-4">Are you sure you want to delete this MCP server? This action cannot be undone.</p>
    <div class="form-actions flex justify-end gap-2 pt-2 border-t border-slate-200/80 dark:border-slate-800/80">
      <button type="button" class="btn btn--secondary" id="cancel-delete-btn">Cancel</button>
      <button type="button" class="btn btn--danger" id="confirm-delete-btn">Delete</button>
    </div>
  </div>
</div>
